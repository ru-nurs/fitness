services:
  - type: web
    name: fitness
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: APP_STATE_KEY
        value: sportshopfitness
      - key: SESSION_SECRET
        generateValue: true
